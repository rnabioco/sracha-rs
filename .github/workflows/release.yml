name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        # x86_64 ships two microarchitecture variants: v2 (SSE4.2, every CPU
        # since ~2009 — the safe default) and v3 (AVX2/BMI, Haswell 2013+ —
        # best SIMD throughput on the byte-plane decode loops). ARM targets
        # build a single artifact (no x86 microarch levels apply).
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cpu: x86-64-v2
            suffix: -v2
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cpu: x86-64-v3
            suffix: -v3
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
            cpu: x86-64-v2
            suffix: -v2
          - target: x86_64-apple-darwin
            os: macos-latest
            cpu: x86-64-v3
            suffix: -v3
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows ships one baseline binary rather than the v2/v3 pair: the
          # Windows audience for this tool is small enough that a second
          # artifact is more of a "which do I pick?" tax than a speedup.
          # crt-static keeps the promise the README makes for every other
          # target — one file, no runtime to install (MSVC otherwise links the
          # CRT dynamically and the exe needs VCRUNTIME140.dll).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            extra_rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # No rust-cache here on purpose. This workflow only ever runs on a tag
      # push, and a cache saved under refs/tags/vX is never visible to the
      # next tag — so every restore missed and every save burned ~300 MB of
      # the repo's 10 GB quota, evicting the CI caches that do get reused.

      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # Built from source on purpose: cross's newest *release* is v0.2.5
      # (Feb 2023), which predates edition 2024, so the prebuilt binary
      # taiki-e/install-action would fetch cannot build this workspace.
      # --locked resolves against cross's own Cargo.lock so a release two
      # months from now compiles the same dependency set as this one.
      - name: Install cross (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        # reqwest's `rustls` feature pins the aws-lc-rs crypto provider, and
        # aws-lc-sys assembles its x86_64 routines with NASM, which the runner
        # image does not carry (it does have the CMake that build also wants).
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        env:
          # Empty for ARM (no cpu set); raises the ISA floor for x86 variants;
          # appends whatever a target asks for on top (Windows: static CRT).
          RUSTFLAGS: ${{ format('{0} {1}', matrix.cpu && format('-C target-cpu={0}', matrix.cpu) || '', matrix.extra_rustflags || '') }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="sracha-${version}-${{ matrix.target }}${{ matrix.suffix }}"
          cd target/${{ matrix.target }}/release
          if [ -f sracha.exe ]; then
            # Explorer opens a .zip natively; a .tar.gz would send Windows
            # users looking for a third-party extractor.
            7z a "../../../${name}.zip" sracha.exe
          else
            tar czf "../../../${name}.tar.gz" sracha
          fi
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sracha-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}
          path: |
            sracha-*-${{ matrix.target }}${{ matrix.suffix }}.tar.gz
            sracha-*-${{ matrix.target }}${{ matrix.suffix }}.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract changelog for this version
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Extract the section between this version's header and the next
          body=$(awk -v ver="$version" '
            /^## / { if (found) exit; if ($0 ~ ver) found=1; next }
            found { print }
          ' CHANGELOG.md)
          # Write to file to preserve newlines
          echo "$body" > release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
