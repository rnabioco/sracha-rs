name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  # Deliberately unfiltered, unlike the push trigger above. `CI Status` is a
  # required check on main, and a required check that never runs leaves a PR
  # blocked on a report that will never arrive — which would strand every
  # docs-only PR, the weekly bioconda-sync bot's included.
  pull_request:
    branches: [main]

concurrency:
  # Supersede a PR's in-flight run when it is pushed again. Pushes to main are
  # never cancelled: each main commit has to keep its own pass/fail record and
  # finish saving the caches every PR restores from.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Debuginfo is most of the target-dir bytes the cache has to ship and is
  # never read here — no CI job opens a debugger or wants source lines in a
  # backtrace, and frame *names* still resolve without it. The coverage job
  # opts back in below.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Read the test jobs' target dir for prebuilt dependency rlibs
          # rather than keeping a third near-identical copy of them. Clippy's
          # own metadata is written with a different fingerprint, so nothing
          # collides; save-if false keeps it out of the shared entry.
          shared-key: tests
          save-if: false
      - name: Format
        run: cargo fmt --all -- --check
      # This type-checks every target under every feature. A `cargo check`
      # with the same flags afterwards only re-derives what clippy just
      # proved, so there isn't one.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: check
    timeout-minutes: 20
    strategy:
      # One platform failing should not cancel the other's report.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with `check` and `integration`, which compile the same
          # crates with the same flags. rust-cache still partitions by
          # os/arch, so each OS keeps a separate entry.
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        # reqwest's `rustls` feature pins the aws-lc-rs crypto provider, and
        # aws-lc-sys assembles its x86_64 routines with NASM, which is not on
        # the runner image. CMake is. Chocolatey ships with the runner, so
        # this needs no third-party action.
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - name: Run tests
        run: cargo nextest run --all-features --profile ci

  integration:
    name: Integration Test (${{ matrix.os }})
    needs: check
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Windows is here, and not only in `test`, on purpose: the #[ignore]d
      # tests are the only ones that download a real archive, mmap it, and
      # then delete or rename it. Windows refuses to unlink a file with a live
      # mapping, so that interaction cannot be proved by the unit tests.
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: false
      - uses: taiki-e/install-action@nextest
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - name: Cache SRA fixture
        uses: actions/cache@v6
        with:
          path: crates/sracha-core/tests/fixtures
          key: sra-fixture-SRR28588231-v1
      # Deliberately the same cargo arguments as the Test job. `-p
      # sracha-core` would resolve features over only that package's subgraph,
      # dropping sracha-vdb's `colstats` and forcing a full rebuild of the
      # workspace under a second feature set; narrowing to the package with a
      # nextest filter instead leaves the build identical, so this reuses the
      # binaries already in the shared cache.
      - name: Run integration tests
        run: >
          cargo nextest run --all-features --profile ci
          --run-ignored=ignored-only -E 'package(sracha-core)'

  coverage:
    name: Coverage
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # llvm-cov resolves counters back to source lines, so this job keeps the
      # debuginfo the rest of the workflow drops.
      CARGO_PROFILE_TEST_DEBUG: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # Instrumented builds carry their own RUSTFLAGS, so this job cannot
      # share the test cache and keeps a key of its own.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Coverage measures the default (non-ignored) test suite only; the
      # #[ignore]d integration tests download real SRA files from NCBI and
      # would make the number depend on network state. Tests run once with
      # --no-report; the report steps below reuse the collected profdata.
      - name: Run tests with coverage instrumentation
        run: cargo llvm-cov nextest --all-features --workspace --no-report
      - name: Export lcov
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Generate HTML report
        run: cargo llvm-cov report --html --output-dir coverage-html
      - name: Detailed per-file report → job summary
        run: |
          {
            echo '## Coverage report'
            echo
            echo '_Default (non-ignored) test suite. cSRA / network paths are exercised only by the `#[ignore]`d integration tests and read low here by design._'
            echo
            echo '```'
            cargo llvm-cov report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lcov artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      # A different rustc means a different fingerprint for every artifact, so
      # this job cannot share the stable jobs' cache.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check MSRV
        run: cargo check --all-targets

  ci-status:
    # The one required check on main. Naming a single aggregate here rather
    # than each matrix leg means adding or renaming a platform never silently
    # drops a requirement (a required check that no longer exists blocks
    # everything) or leaves a new one ungated.
    #
    # `integration` and `coverage` are watched but not gated: the integration
    # suite downloads real archives from NCBI, so making it blocking would let
    # an NCBI outage stop all merges. They still run, and still report.
    name: CI Status
    if: always()
    needs: [check, test, msrv, integration, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Check gating jobs
        env:
          RESULTS: ${{ needs.check.result }} ${{ needs.test.result }} ${{ needs.msrv.result }}
        run: |
          echo "check/test/msrv: $RESULTS"
          echo "integration: ${{ needs.integration.result }} (not gating)"
          echo "coverage:    ${{ needs.coverage.result }} (not gating)"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a gating job did not pass ($r)"; exit 1 ;;
            esac
          done
