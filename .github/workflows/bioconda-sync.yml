name: Bioconda Version Sync

on:
  schedule:
    # Weekly, Mondays 09:00 UTC. Bioconda's bot usually opens its recipe PR
    # within a day or two of a GitHub release, and BioContainers builds the
    # image shortly after that, so a weekly sweep keeps the docs within a few
    # days of whatever is actually installable.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync docs version pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rewrite pins from Bioconda / BioContainers
        run: python3 .github/scripts/sync-bioconda-version.py

      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: bot/bioconda-version-sync
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Docs already match the current Bioconda release, nothing to do."
            exit 0
          fi

          version=$(grep -om1 'quay.io/biocontainers/sracha:[0-9][0-9.]*' README.md \
            | sed 's|.*:||')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -am "docs: bump Bioconda/BioContainers pins to ${version}"
          git push --force origin "$BRANCH"

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "PR already open for $BRANCH; force-push refreshed it."
            exit 0
          fi

          printf '%s\n' \
            "The container tags and \`conda\` directive pin in \`README.md\` and" \
            "\`docs/index.md\` were behind what Bioconda and BioContainers actually" \
            "publish. Regenerated by \`.github/scripts/sync-bioconda-version.py\`." \
            "" \
            "quay.io publishes no \`latest\` tag for BioContainers images, so these" \
            "pins name a concrete \`<version>--<build>\` and have to be refreshed" \
            "after each release." \
            "" \
            "The \`?v=\` on the Anaconda badge URLs is flipped in the same pass." \
            "Those badges render the current version themselves, but GitHub" \
            "serves README images through its camo proxy, which caches them long" \
            "past a release — changing the URL is what forces a re-fetch." > pr-body.md

          gh pr create \
            --head "$BRANCH" \
            --title "docs: bump Bioconda/BioContainers pins to ${version}" \
            --body-file pr-body.md
